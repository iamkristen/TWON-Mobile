name: twon_mobile
description: The Wolves of Nepal community app for Android and iOS.
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.10.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  flutter_svg: ^2.3.0
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  go_router: ^18.0.2
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5
  cached_network_image: ^4.0.4
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  intl: ^0.20.3
  socket_io_client: ^3.1.6
  qr_flutter: ^4.1.0
  record: ^7.1.1
  audioplayers: ^6.8.1
  path_provider: ^2.1.6
  visibility_detector: ^0.4.0+2
  flutter_animate: ^4.5.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  url_launcher_platform_interface: ^2.3.2
flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/illustrations/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
